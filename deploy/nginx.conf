# =================================================================
# Nginx конфигурация для GeoMind Assistant
# Копировать в: /etc/nginx/sites-available/geomind
# Затем: ln -s /etc/nginx/sites-available/geomind /etc/nginx/sites-enabled/
# =================================================================

server {
    listen 80;
    server_name geomind.ru www.geomind.ru;  # ← Заменить на ваш домен

    # Редирект на HTTPS (после настройки certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (если понадобится)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Статические файлы напрямую через nginx (быстрее)
    location /static/ {
        alias /opt/geomind-assistant/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Ограничение размера загружаемых файлов
    client_max_body_size 10M;
}

# ============================================================
# После установки SSL (certbot --nginx -d geomind.ru):
# Certbot автоматически добавит блок server для порта 443
# и раскомментирует редирект в блоке выше
# ============================================================
