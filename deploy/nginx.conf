# =================================================================
# Nginx конфигурация для GeoMind Assistant
# Копировать в: /etc/nginx/sites-available/geomind
# Затем: ln -s /etc/nginx/sites-available/geomind /etc/nginx/sites-enabled/
# =================================================================

server {
    listen 80;
    listen [::]:80;
    server_name geomind.pro www.geomind.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geomind.pro www.geomind.pro;

    ssl_certificate /etc/letsencrypt/live/geomind.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geomind.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (если понадобится)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Статические файлы напрямую через nginx (быстрее)
    location /static/ {
        alias /opt/geomind-assistant/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        etag on;
    }

    # Ограничение размера загружаемых файлов
    client_max_body_size 220M;
}
