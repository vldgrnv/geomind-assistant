<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMind — Вход</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=project-logo-1">
    <link rel="stylesheet" href="/static/css/style.min.css?v=perf-ops-4">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h1>🌍 GeoMind</h1>
        <p id="auth-subtitle">Войдите в личный кабинет</p>

        <div id="error" class="error-msg"></div>

        <form id="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input class="input" type="email" id="email" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input class="input" type="password" id="password" placeholder="••••••••" required>
            </div>
            <button class="btn btn-primary btn-full" type="submit" id="submit-btn">Войти</button>
        </form>

        <div class="auth-footer">
            <span id="toggle-text">Нет аккаунта?</span>
            <a href="#" id="toggle-link">Зарегистрироваться</a>
        </div>
    </div>
</div>
<script src="/static/js/auth.min.js?v=perf-ops-4"></script>
</body>
</html>
